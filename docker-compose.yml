services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: sofomeutex-global-wholesale-import:latest
    container_name: sofomeutex-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

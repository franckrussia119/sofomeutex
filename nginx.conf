server {
    listen 0.0.0.0:3000;
    listen 0.0.0.0:80;
    listen [::]:3000;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml
        font/woff2;

    # Cache hashed build assets aggressively
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Product / gallery images copied from /public/assets/images
    location ~* \.(?:jpg|jpeg|png|gif|webp|avif|svg|ico)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Never cache the HTML shell so deployments show up immediately
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # SPA fallback: any unknown path serves index.html so client-side routing works
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Basic security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
